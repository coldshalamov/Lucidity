[package]
name = "lucidity-ui"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Lucidity desktop shell: egui application chrome around an embedded WezTerm surface"

[dependencies]
egui = "0.32.3"
serde = { workspace = true, features = ["derive"] }
uuid = { workspace = true, features = ["serde", "v4"] }

[dev-dependencies]
serde_json.workspace = true
